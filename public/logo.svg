<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <!-- Cyan glow effect -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00c6ff" flood-opacity="0.4"/>
    </filter>
    <!-- Subtle gradient for play button -->
    <linearGradient id="triangleGrad" x1="100" y1="80" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#243348"/>
      <stop offset="100%" stop-color="#141c2b"/>
    </linearGradient>
    <linearGradient id="cyanLineGrad" x1="140" y1="340" x2="420" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Dark Slate Play Triangle with Smooth Rounded Corners -->
  <path d="M 140 85 
           C 140 70, 155 60, 170 68 
           L 415 228 
           C 432 238, 432 262, 415 272 
           L 170 432 
           C 155 440, 140 430, 140 415 
           Z" 
        fill="url(#triangleGrad)" />

  <!-- Inside Graph and Arrow with Cyan Glow -->
  <g filter="url(#cyanGlow)">
    <!-- Bar Charts (outlined vertical bars with rounded caps) -->
    <!-- Bar 1 (Left) -->
    <path d="M 175 365 L 175 285" stroke="#00f2fe" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Bar 2 -->
    <path d="M 215 365 L 215 225" stroke="#00f2fe" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Bar 3 -->
    <path d="M 255 365 L 255 270" stroke="#00f2fe" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Bar 4 -->
    <path d="M 295 365 L 295 210" stroke="#00f2fe" stroke-width="12" stroke-linecap="round"/>

    <!-- Rising Line Chart -->
    <path d="M 155 320 
             L 215 205 
             L 270 265 
             L 395 135" 
          fill="none" 
          stroke="url(#cyanLineGrad)" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Arrow Head pointing Up-Right (↗) bursting past the top edge -->
    <path d="M 350 135 
             L 420 110 
             L 395 180 
             L 380 150 
             Z" 
          fill="#00f2fe" 
          stroke="#00f2fe" 
          stroke-width="4" 
          stroke-linejoin="round"/>
  </g>
</svg>
